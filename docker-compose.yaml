services:
  api:
    container_name: ${APP_NAME}_api
    build:
      context: .
      dockerfile: .docker/api/Dockerfile.api
      target: production
      args:
        PHP_VERSION: ${PHP_VERSION:-cli}
        COMPOSER_VERSION: ${COMPOSER_VERSION:-latest}
    environment:
      DB_CONNECTION: mariadb
      DB_HOST: database
      DB_DATABASE: ${DB_DATABASE:-${APP_NAME}}
      DB_USERNAME: ${DB_USERNAME:-${APP_NAME}}
      DB_PASSWORD: ${DB_PASSWORD:-${APP_NAME}}
      REDIS_HOST: cache
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - appnet
    restart: unless-stopped

  website:
    container_name: ${APP_NAME}_website
    build:
      context: .
      dockerfile: .docker/website/Dockerfile.website
      target: production
      args:
        NODE_VERSION: ${NODE_VERSION:-latest}
    depends_on:
      api:
        condition: service_started
    networks:
      - appnet
    restart: unless-stopped

  database:
    container_name: ${APP_NAME}_database
    image: mariadb:${MARIADB_VERSION:-latest}
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_DATABASE:-${APP_NAME}}
      MARIADB_USER: ${DB_USERNAME:-${APP_NAME}}
      MARIADB_PASSWORD: ${DB_PASSWORD:-${APP_NAME}}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - database_data:/var/lib/mysql
    networks:
      - appnet
    restart: unless-stopped

  cache:
    container_name: ${APP_NAME}_cache
    image: redis:${REDIS_VERSION:-latest}
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - cache_data:/data
    networks:
      - appnet
    restart: unless-stopped

  proxy:
    container_name: ${APP_NAME}_proxy
    image: nginx:${NGINX_VERSION:-latest}
    depends_on:
      api:
        condition: service_started
      website:
        condition: service_started
    volumes:
      - ./.docker/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - appnet
    restart: unless-stopped

  tunnel:
    container_name: ${APP_NAME}_tunnel
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-latest}
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      proxy:
        condition: service_started
    networks:
      - appnet
    restart: unless-stopped

volumes:
  cache_data:
  database_data:

networks:
  appnet:
    driver: bridge
