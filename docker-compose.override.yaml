services:
  api:
    build:
      target: development
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      COMPOSER_HOME: /tmp/composer
    volumes:
      - ./api:/var/www/html
    networks:
      - appnet
      - moznet

  website:
    build:
      target: development
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      npm_config_cache: /tmp/npm-cache
    volumes:
      - ./website:/usr/src/app
      - ./packages/darkclaw-census-api-client-typescript-axios:/usr/src/packages/darkclaw-census-api-client-typescript-axios
    networks:
      - appnet
      - moznet

  proxy:
    profiles: ["production"]

  tunnel:
    profiles: ["production"]

networks:
  moznet:
    external: true
